<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Invalid Link</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #fff7ed;
    }

    .box {
      background: white;
      padding: 50px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0px 6px 20px rgba(0,0,0,0.15);
    }

    h1 {
      color: #f97316;
      margin-bottom: 10px;
    }

    p {
      color: gray;
      font-size: 14px;
    }

    .icon {
      font-size: 70px;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>
  <div class="box">
    <div class="icon">⚠️</div>
    <h1>Invalid or Expired Link</h1>
    <p>This approval link is no longer valid.</p>
  </div>
</body>
</html>
