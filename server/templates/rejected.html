<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Timesheet Rejected</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #fef2f2;
      }

      .box {
        background: white;
        padding: 50px;
        border-radius: 18px;
        text-align: center;
        box-shadow: 0px 6px 20px rgba(0, 0, 0, 0.15);
        animation: pop 0.6s ease;
      }

      @keyframes pop {
        from {
          transform: scale(0.7);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      h1 {
        color: #dc2626;
        margin-bottom: 10px;
      }

      p {
        color: gray;
        font-size: 14px;
      }

      .icon {
        font-size: 70px;
        margin-bottom: 15px;
        animation: shake 0.8s infinite;
      }

      @keyframes shake {
        0% {
          transform: rotate(0deg);
        }
        25% {
          transform: rotate(-5deg);
        }
        50% {
          transform: rotate(5deg);
        }
        75% {
          transform: rotate(-5deg);
        }
        100% {
          transform: rotate(0deg);
        }
      }
    </style>
  </head>

  <body>
    <div class="box">
      <div class="icon">
        <svg width="100" height="100" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" fill="#FEE2E2" />
          <path
            d="M9 9L15 15M15 9L9 15"
            stroke="#DC2626"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
      <h1>Timesheet Rejected</h1>
      <p>Please review and resubmit your weekly report.</p>
    </div>
  </body>
</html>
